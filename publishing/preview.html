<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background:
      radial-gradient(ellipse at 50% 30%, #3a2f22 0%, #1c1712 55%, #0c0a08 100%);
    position: relative;
  }

  /* subtle parchment/dust texture via layered gradients */
  .texture {
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 6px),
      repeating-linear-gradient(25deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 3px, transparent 3px, transparent 9px);
    mix-blend-mode: overlay;
  }

  .vignette {
    position: absolute; inset: 0;
    box-shadow: inset 0 0 220px 60px rgba(0,0,0,0.75);
  }

  .frame {
    position: absolute; inset: 34px;
    border: 3px solid #6b5636;
    box-shadow: 0 0 0 10px rgba(0,0,0,0.55), inset 0 0 0 10px rgba(0,0,0,0.4), inset 0 0 0 12px #4a3a22;
  }
  .frame::before, .frame::after,
  .frame .c2, .frame .c3 {
    content: ""; position: absolute; width: 46px; height: 46px;
    border: 3px solid #d9b872;
    opacity: 0.85;
  }
  .frame::before { top: -3px; left: -3px; border-right: none; border-bottom: none; }
  .frame::after  { top: -3px; right: -3px; border-left: none; border-bottom: none; }
  .frame .c2 { bottom: -3px; left: -3px; border-right: none; border-top: none; }
  .frame .c3 { bottom: -3px; right: -3px; border-left: none; border-top: none; }

  .scene {
    position: absolute; left: 0; right: 0; bottom: 210px; height: 360px;
  }
  .road {
    position: absolute; left: -5%; right: -5%; bottom: 0; height: 190px;
    background: linear-gradient(180deg, #5b4a34 0%, #3a2e20 60%, #241c13 100%);
    clip-path: polygon(0 100%, 100% 100%, 78% 0, 22% 0);
    opacity: 0.9;
  }
  .sun {
    position: absolute; left: 50%; top: -40px; width: 260px; height: 260px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(214,150,58,0.55) 0%, rgba(214,150,58,0.18) 45%, rgba(214,150,58,0) 72%);
  }

  /* wagon silhouette, built from flat shapes */
  .wagon { position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%); width: 640px; height: 300px; }
  .wagon .wheel {
    position: absolute; bottom: 0; width: 108px; height: 108px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #2b2117 0%, #16110b 70%);
    border: 8px solid #0c0906;
    box-shadow: 0 0 0 3px #35281a inset;
  }
  .wagon .wheel::after {
    content:""; position:absolute; inset: 30px; border-radius:50%; border: 6px solid #35281a;
  }
  .wagon .wheel.w1 { left: 34px; }
  .wagon .wheel.w2 { left: 240px; }
  .wagon .wheel.w3 { left: 448px; }
  .wagon .bed {
    position: absolute; bottom: 78px; left: 0; width: 620px; height: 96px;
    background: linear-gradient(180deg, #5c3f24 0%, #402a17 100%);
    border-radius: 6px;
    box-shadow: 0 6px 0 #2a1c0f;
  }
  .wagon .cover {
    position: absolute; bottom: 150px; left: 26px; width: 566px; height: 150px;
    background: linear-gradient(180deg, #cbb384 0%, #a68e5f 55%, #8a7248 100%);
    border-radius: 130px 130px 20px 20px / 90px 90px 20px 20px;
    box-shadow: inset 0 -18px 30px rgba(0,0,0,0.25), 0 10px 0 rgba(0,0,0,0.15);
  }
  .wagon .cover::before, .wagon .cover::after {
    content:""; position:absolute; top: 0; bottom: 0; width: 3px; background: rgba(0,0,0,0.18);
  }
  .wagon .cover::before { left: 33%; }
  .wagon .cover::after { left: 66%; }
  .wagon .banner {
    position: absolute; bottom: 300px; left: 288px; width: 8px; height: 46px; background: #2a1c0f;
  }
  .wagon .banner::after {
    content:""; position:absolute; top: 0; left: 8px; width: 64px; height: 40px;
    background: linear-gradient(135deg, #8a1f1f, #5c1212);
    clip-path: polygon(0 0, 100% 0, 100% 60%, 60% 100%, 0 100%);
    box-shadow: 0 0 0 2px rgba(0,0,0,0.4);
  }

  .escort { position: absolute; bottom: 42px; width: 40px; height: 118px; }
  .escort .head { position:absolute; top:0; left: 10px; width: 20px; height: 20px; border-radius: 50%; background: #b8b3a8; box-shadow: 0 0 0 3px #2a271f; }
  .escort .body { position:absolute; top: 20px; left: 4px; width: 32px; height: 52px; background: linear-gradient(180deg,#6f6558,#42392c); border-radius: 6px; }
  .escort .shield { position:absolute; top: 26px; left: -10px; width: 22px; height: 34px; background: linear-gradient(160deg,#8a1f1f,#4a1010); border-radius: 4px 4px 10px 10px; box-shadow: 0 0 0 2px #1a0d0d; }
  .escort .spear { position:absolute; top: -34px; left: 30px; width: 4px; height: 96px; background: #2a2116; }
  .escort .spear::after { content:""; position:absolute; top:-10px; left:-3px; width: 10px; height: 16px; background:#c9c4b8; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .escort .legs { position:absolute; top: 70px; left: 8px; width: 24px; height: 30px; background: linear-gradient(180deg,#3a3226,#1e1a12); border-radius: 3px; }
  .escort.e1 { left: 46px; }
  .escort.e2 { left: 128px; }
  .escort.e3 { left: 800px; }
  .escort.e4 { left: 880px; }

  .title-wrap { position: absolute; left: 0; right: 0; top: 120px; text-align: center; }
  .kicker {
    color: #d9b872; letter-spacing: 10px; font-size: 22px; font-weight: 400;
    text-transform: uppercase; opacity: 0.85; text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  }
  .title {
    margin-top: 14px; font-size: 108px; font-weight: 700; letter-spacing: 4px;
    color: #f2e3bf;
    text-shadow: 0 3px 0 #5c3f1f, 0 6px 14px rgba(0,0,0,0.7), 0 0 40px rgba(217,184,114,0.25);
  }
  .rule { margin: 26px auto 0; width: 360px; height: 3px; background: linear-gradient(90deg, transparent, #d9b872, transparent); }
  .subtitle {
    margin-top: 20px; font-size: 27px; color: #c9bd9c; letter-spacing: 2px; font-style: italic;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  }

  .footer-ribbon {
    position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%);
    background: linear-gradient(180deg, #5c1212, #3a0b0b);
    color: #f2e3bf; padding: 12px 46px; font-size: 24px; letter-spacing: 3px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.5), inset 0 0 0 2px #8a1f1f;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="texture"></div>
  <div class="sun"></div>

  <div class="scene">
    <div class="road"></div>
    <div class="escort e1"><div class="spear"></div><div class="head"></div><div class="body"></div><div class="shield"></div><div class="legs"></div></div>
    <div class="escort e2"><div class="spear"></div><div class="head"></div><div class="body"></div><div class="shield"></div><div class="legs"></div></div>
    <div class="escort e3"><div class="spear"></div><div class="head"></div><div class="body"></div><div class="shield"></div><div class="legs"></div></div>
    <div class="escort e4"><div class="spear"></div><div class="head"></div><div class="body"></div><div class="shield"></div><div class="legs"></div></div>
    <div class="wagon">
      <div class="cover"></div>
      <div class="bed"></div>
      <div class="wheel w1"></div>
      <div class="wheel w2"></div>
      <div class="wheel w3"></div>
    </div>
  </div>

  <div class="title-wrap">
    <div class="kicker">Mount &amp; Blade II · Bannerlord Mod</div>
    <div class="title">HEAVY<br>CARAVANS</div>
    <div class="rule"></div>
    <div class="subtitle">a third, heavier caravan option</div>
  </div>

  <div class="footer-ribbon">v0.1.0</div>

  <div class="frame"><span class="c2"></span><span class="c3"></span></div>
  <div class="vignette"></div>
</body>
</html>
