# HeavyCaravans configuration (phases/14-config.md)
#
# NOTE: if HeavyCaravans is installed via Steam Workshop, edits to THIS file
# get overwritten whenever the mod updates. For changes that should survive
# updates/reinstalls, edit (or create) instead:
#   Documents/Mount and Blade II Bannerlord/Configs/ModSettings/HeavyCaravans/HeavyCaravans.ini
# (auto-created with the current values on first launch - same values there win.)
#
# GlobalCaravanTroopMultiplier applies uniformly to the starting troop count of
# every caravan (normal, elite and Heavy alike). 1.0 = identical to vanilla/TAOM.
GlobalCaravanTroopMultiplier = 1.0

# How much bigger a Heavy Caravan's troops/capacity are relative to a regular
# elite caravan (which itself already has GlobalCaravanTroopMultiplier applied
# above). The two stack: EliteBase * GlobalCaravanTroopMultiplier * HeavyCaravanTroopMultiplier.
# This is the value to raise if you want a bigger Heavy Caravan specifically.
HeavyCaravanTroopMultiplier = 2.0

# How many extra troops (beyond the scaled base capacity above) a Heavy
# Caravan can additionally be reinforced with (phases/09-bonuskapazitaet.md).
HeavyCaravanBonusCapacity = 20

# How much more a Heavy Caravan costs to form, relative to the elite caravan
# price (phases/06-dritte-caravan-option.md). Provisional balancing value.
HeavyCaravanPriceMultiplier = 2.0
